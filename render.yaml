services:
  - type: web
    name: researchly-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: INGEST_TOKEN          # shared secret for POST /api/conferences/ingest (GitHub Action)
        generateValue: true
      - key: ENABLE_LIVE_CHECKS    # true = DBLP + RDAP lookups during audits
        value: "false"
      - key: ENABLE_CURATED_SEED   # false hides the unverified hand-entered seed list
        value: "true"

  - type: web
    name: researchly-site
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: researchly-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
