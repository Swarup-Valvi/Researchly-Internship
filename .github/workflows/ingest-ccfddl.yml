name: ingest-ccfddl

# Every 12 h: read the ccfddl open dataset (MIT, (c) CCFDDL) and POST the records to the backend.
# Idempotent: storage/state.json (restored from the Actions cache) holds the last processed commit SHA, so an
# unchanged dataset is skipped after one `git ls-remote`, and the backend upserts by conference id.
# Nothing is crawled until `tos_reviewed: true` is set for ccfddl in researchly_pipeline/config/sources.yaml.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: researchly-pipeline-state     # shared with enrich-nightly: never write state.json concurrently
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: researchly_pipeline/requirements.txt
      - run: pip install -r researchly_pipeline/requirements.txt
      # Backend deps first: researchly_pipeline/tests/test_eval_score.py runs the backend engine through node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: python -m pytest -q
        working-directory: researchly_pipeline
      - run: npm test
        working-directory: backend

  ingest:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: researchly_pipeline/requirements.txt
      - run: pip install -r researchly_pipeline/requirements.txt
      # Only state.json is cached (commit SHA, URL hashes, verified enrichment quotes). No committee names.
      - uses: actions/cache/restore@v4
        with:
          path: researchly_pipeline/storage/state.json
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-
      - name: Run ccfddl source
        working-directory: researchly_pipeline
        run: python run.py --source ccfddl
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: researchly_pipeline/storage/state.json
          key: pipeline-state-${{ github.run_id }}
      - name: Push to backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          OUT=researchly_pipeline/storage/output/conferences.json
          if [ ! -s "$OUT" ] || [ "$(python -c 'import json,sys;print(len(json.load(open(sys.argv[1]))))' "$OUT")" = "0" ]; then
            echo "Nothing new (dataset unchanged or source not reviewed). Nothing to ingest."; exit 0
          fi
          curl -fsS --retry 2 --retry-delay 30 --retry-connrefused --max-time 900 -X POST "$BACKEND_URL/api/conferences/ingest" \
            -H "content-type: application/json" -H "x-ingest-token: $INGEST_TOKEN" --data-binary @"$OUT"
      # Only dead-letter notes and run metrics are uploaded. storage/output/ is NOT uploaded:
      # it can contain program-committee names, which must not be persisted outside the audit.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-diagnostics
          path: |
            researchly_pipeline/storage/failed/
            researchly_pipeline/storage/output/metrics.json
          if-no-files-found: ignore
